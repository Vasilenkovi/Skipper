name: Kotlin CI & Lint

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  lint-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make Gradle executable
        run: chmod +x ./gradlew
        working-directory: backend

      - name: Run ktlint & detekt
        run: ./gradlew ktlintCheck detekt --no-daemon
        working-directory: backend
      - name: Upload Detekt Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: detekt-report
         path: backend/build/reports/detekt/detekt.html

      - name: Upload Ktlint Report  
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: ktlint-report
         path: backend/build/reports/ktlint/
      - name: Run API Contract Tests
        run: ./gradlew test --tests "ApiContractTest" --no-daemon
        working-directory: backend
        env:
          JWT_SECRET: test-secret-key-for-contract-testing
      - name: Run Security and Route Tests
        run: ./gradlew test --tests "ApiSecurityTest" --tests "*RoutesTest" --no-daemon
        working-directory: backend

      - name: Validate OpenAPI Spec
        run: |
          npm install -g @apidevtools/swagger-cli
          swagger-cli validate openapi.yaml
        working-directory: backend
        continue-on-error: true
